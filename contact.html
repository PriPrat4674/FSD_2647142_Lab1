<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us - Recruitment Management System</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="navbar">
      <ul>
        <li><a href="home_page.html">Home</a></li>
        <li><a href="jobs.html">Job Listings</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="login.html">Login / Sign Up</a></li>
      </ul>
    </div>
    <div class="container">
      <h1>Contact Support</h1>
      <p>
        Have questions about recruitment or your application? Reach out to us.
      </p>
      <div class="form-wrapper">
        <form action="#" method="POST">
          <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="Your Name" />
          </div>
          <div class="form-group">
            <label for="contact-email">Email Address</label>
            <input
              type="email"
              id="contact-email"
              name="contact-email"
              placeholder="Your Email"
            />
          </div>
          <div class="form-group">
            <label for="message">Message</label>
            <textarea
              name="message"
              id="message"
              rows="5"
              placeholder="How can we help ?"
            ></textarea>
          </div>
          <button type="submit">Send Message</button>
        </form>
      </div>
    </div>

    <div class="footer">
      <p>&copy; 2026 Recruitment Management System. All Rights reserved.</p>
    </div>
  </body>
</html>
